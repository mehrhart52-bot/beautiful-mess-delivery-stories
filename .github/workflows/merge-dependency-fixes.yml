name: Merge validated dependency fixes
on:
  workflow_run:
    workflows: [Validate app changes, Code security scan]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: merge-dependency-fixes
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read only the trusted default-branch script, never the PR's code.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/scripts/merge-dependency-fixes.cjs');
            await run({github, context, core});
